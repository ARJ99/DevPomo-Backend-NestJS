<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DevPomo timer logo">
  <!-- stopwatch side buttons -->
  <rect x="6" y="46" width="14" height="8" rx="4" fill="#e14658"/>
  <rect x="108" y="46" width="14" height="8" rx="4" fill="#e14658"/>

  <!-- crown / top button -->
  <rect x="58" y="8" width="12" height="10" rx="3" fill="#2d3748"/>
  <rect x="54" y="4" width="20" height="6" rx="3" fill="#e14658"/>

  <!-- stopwatch body -->
  <circle cx="64" cy="70" r="52" fill="#1a202c"/>
  <circle cx="64" cy="70" r="52" fill="none" stroke="#e14658" stroke-width="4"/>

  <!-- face ring (inner) -->
  <circle cx="64" cy="70" r="42" fill="#12151c"/>

  <!-- progress arc: 25-minute pomodoro ~ 3/4 ring -->
  <path d="M64 28 A42 42 0 1 1 22 70" fill="none" stroke="#e14658" stroke-width="6" stroke-linecap="round"/>

  <!-- tick marks -->
  <g stroke="#4a5568" stroke-width="2" stroke-linecap="round">
    <line x1="64" y1="32" x2="64" y2="38"/>
    <line x1="96" y1="70" x2="102" y2="70"/>
    <line x1="64" y1="102" x2="64" y2="108"/>
    <line x1="26" y1="70" x2="32" y2="70"/>
  </g>

  <!-- digital display -->
  <rect x="42" y="58" width="44" height="24" rx="4" fill="#0b0e14" stroke="#2d3748" stroke-width="1.5"/>
  <text x="64" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#63d471">25:00</text>

  <!-- ring marker at the end of the progress arc -->
  <circle cx="22" cy="70" r="5" fill="#e14658"/>
</svg>
